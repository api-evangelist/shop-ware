  /api/v1/tenants/{tenant_id}/staffs/notification:
    parameters:
    - name: tenant_id
      in: path
      required: true
      example: '1'
      schema:
        type: integer
    post:
      summary: Notify staff
      tags:
      - Staff Members
      parameters: []
      responses:
        '200':
          description: successful
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Notification title.
                body:
                  type: string
                  description: Notification message.
                url:
                  type: string
                  nullable: true
                  description: URL that will open in a new window when clicked.
                recipients:
                  type: array
                  nullable: true
                  description: List of staffIDs to whom the notification will be sent. If left blank, sent to all logged in staff.
                  items:
                    type: integer
              required:
              - title
              - body
              example:
                title: Notification Title
                body: Notification Body
                url: URL
                recipients:
                - 1
