    get:
      summary: Get a list of all repair orders
      tags:
      - Repair Orders
      parameters:
      - name: cursor
        in: query
        required: false
        description: Encoded reference to the last record of the current page. It is empty for the first page.
        example: ''
        schema:
          type: string
      - name: per_page
        in: query
        required: false
        example: '1'
        schema:
          type: integer
      - name: shop_id
        in: query
        required: false
        description: Filter response to include only Repair Orders with this Shop ID.
        example: null
        schema:
          type: integer
      - name: customer_id
        in: query
        required: false
        description: Filter response to include only Customer with this ID.
        example: null
        schema:
          type: integer
