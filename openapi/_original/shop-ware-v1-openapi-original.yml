  "/api/v1/tenants/{tenant_id}/repair_orders/{id}/share":
    parameters:
    - name: tenant_id
      in: path
      required: true
      example: '1'
      schema:
        type: integer
    - name: id
      in: path
      required: true
      example: '1'
      schema:
        type: integer
    post:
      summary: Share repair order via text
      tags:
      - Repair Orders
      parameters: []
      responses:
        '200':
          description: successful
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone_numbers:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: RO customer phone numbers to send text sms with RO
                    share link and message.
                text:
                  type: string
                  maxLength: 1480
                  description: Text which will be sent in sms along with RO share
                    link. If not present will be sent RO share link only.
              required:
              - phone_numbers
              example:
                phone_numbers:
                - "+14158900906"
                text: Test
