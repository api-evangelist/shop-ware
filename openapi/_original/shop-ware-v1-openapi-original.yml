    parameters:
    - name: tenant_id
      in: path
      required: true
      example: '1'
      schema:
        type: integer
    get:
      summary: Get a list of all repair orders
      tags:
      - Repair Orders
      parameters:
      - name: page
        in: query
        required: false
        example: '1'
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        example: '30'
        schema:
          type: integer
      - name: shop_id
        in: query
        required: false
        description: Filter response to include only Repair Orders with this Shop
          ID.
        example:
        schema:
          type: integer
      - name: customer_id
        in: query
        required: false
        description: Filter response to include only Customer with this ID.
        example:
        schema:
          type: integer
      - name: vehicle_id
        in: query
        required: false
        description: Filter response to include only Vehicle with this ID.
