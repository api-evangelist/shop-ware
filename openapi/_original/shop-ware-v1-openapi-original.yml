      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                number:
                  type: integer
                  nullable: true
                  description: Repair order number
                odometer:
                  type: integer
                  nullable: true
                  description: Mileage value when car is dropped off
                customer_id:
                  type: integer
                  description: A foreign key which points to a Vehicle.id. Represents
                    the vehicle for this RO. The vehicle must be owned by the customer
                    (the Customer.id must be in the Vehicle.customer_ids list).
                technician_id:
                  type: integer
                  nullable: true
                  description: A foreign key which points to a Staff.id. Represents
                    the technician assigned to this RO.
                advisor_id:
                  type: integer
                  nullable: true
                  description: A foreign key which points to a Staff.id. Represents
                    the service advisor assigned to this RO.
                vehicle_id:
                  type: integer
                  nullable: true
                  description: A foreign key which points to a Vehicle.id. Represents
                    the vehicle for this RO.
                label_id:
                  type: integer
                  nullable: true
                  description: A foreign key which points to a Label.id. Represents
                    the label for this RO.
                detail:
                  type: string
                  nullable: true
                  description: Notes made by the staff about this RO.
                preferred_contact_type:
                  type: string
                  nullable: true
                  enum:
                  - waiting
                  - phone
                  - email
                  - text
                  description: How the customer prefers to receive progress updates
                    about this RO. One of 'Waiting', 'Phone', 'Email', 'Text'. More
                    contact types may be added.
                shop_id:
                  type: integer
                  description: A foreign key which points to a Shop.id. Represents
                    the Shop for this RO.
                taxable:
                  type: boolean
                  nullable: true
                  description: Determines if tax rates will apply on this RO.
                due_in_at:
                  type: string
                  nullable: true
                  format: date-tiem
                  description: The datetime the vehicle was scheduled to be dropped
                    off.
                customer_source:
                  type: string
                  nullable: true
                  description: 'The marketing source of the customer for this RO.
                    Example: "Repeat", "Referral", "Website", etc.'
                fleet_po:
                  type: string
                  nullable: true
                  description: Fleet purchase order number. Will be ignored if specified
                    customer is not corporate.
                part_discount_percentage:
                  type: number
                  nullable: true
                  description: RO parts discount in percents. If this parameter has
                    non-null value, part_discount_cents must be ommited or null.
                  minimum: 0
                  maximum: 100
                part_discount_cents:
                  type: integer
                  nullable: true
                  description: RO parts discount in cents. If this parameter has non-null
                    value, part_discount_percentage must be ommited or null.
                  exclusiveMinimum: 0
                labor_discount_percentage:
                  type: number
                  nullable: true
                  description: RO labors discount in percents. If this parameter has
                    non-null value, labor_discount_cents must be ommited or null.
                  minimum: 0
                  maximum: 100
                labor_discount_cents:
                  type: integer
                  nullable: true
                  description: RO labors discount in cents. If this parameter has
                    non-null value, labor_discount_percentage must be ommited or null.
                  exclusiveMinimum: 0
                part_tax_rate:
                  type: number
                  minimum: 0
                  nullable: true
                  description: Part tax rate.
                labor_tax_rate:
                  type: number
                  minimum: 0
                  nullable: true
                  description: Labor tax rate.
                sublet_tax_rate:
                  type: number
                  minimum: 0
                  nullable: true
                  description: Sublet tax rate.
                hazmat_tax_rate:
                  type: number
                  minimum: 0
                  nullable: true
                  description: Hazmat tax rate.
                customer_concern:
                  type: string
                  nullable: true
                  description: Represents the reason for Customer's Visit
                vehicle_use:
                  type: string
                  nullable: true
                  description: Represents the primary use of vehicle
              required:
              - customer_id
              - shop_id
              example:
                number: 175038587
                odometer: 90321
