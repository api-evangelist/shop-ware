      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                number:
                  type: integer
                  nullable: true
                  description: Repair order number
                odometer:
                  type: integer
                  nullable: true
                  description: Mileage value when car is dropped off
                technician_id:
                  type: integer
                  nullable: true
                  description: A foreign key which points to a Staff.id. Represents
                    the technician assigned to this RO.
                advisor_id:
                  type: integer
                  nullable: true
                  description: A foreign key which points to a Staff.id. Represents
                    the service advisor assigned to this RO.
                label_id:
                  type: integer
                  nullable: true
                  description: A foreign key which points to a Label.id. Represents
                    the label for this RO.
                detail:
                  type: string
                  nullable: true
                  description: Notes made by the staff about this RO.
                preferred_contact_type:
                  type: string
                  nullable: true
                  enum:
                  - waiting
                  - phone
                  - email
                  - text
                  description: How the customer prefers to receive progress updates
                    about this RO. One of 'Waiting', 'Phone', 'Email', 'Text'. More
                    contact types may be added.
                taxable:
                  type: boolean
                  nullable: true
                  description: Determines if tax rates will apply on this RO.
                due_in_at:
                  type: string
                  nullable: true
                  format: date-time
                  description: The datetime the vehicle was scheduled to be dropped
                    off.
                status_id:
                  type: integer
                  nullable: true
                  description: A foreign key which points to a Status.id. Represents
                    the status for this RO.
                customer_source:
                  type: string
                  nullable: true
                  description: 'The marketing source of the customer for this RO.
                    Example: "Repeat", "Referral", "Website", etc.'
                part_discount_percentage:
                  type: number
                  nullable: true
                  description: RO parts discount in percents. If this parameter has
                    non-null value, part_discount_cents must be ommited or null.
                  minimum: 0
                  maximum: 100
                part_discount_cents:
                  type: integer
                  nullable: true
                  description: RO parts discount in cents. If this parameter has non-null
                    value, part_discount_percentage must be ommited or null.
                  exclusiveMinimum: 0
                labor_discount_percentage:
                  type: number
                  nullable: true
                  description: RO labors discount in percents. If this parameter has
                    non-null value, labor_discount_cents must be ommited or null.
                  minimum: 0
                  maximum: 100
                labor_discount_cents:
                  type: integer
                  nullable: true
                  description: RO labors discount in cents. If this parameter has
                    non-null value, labor_discount_percentage must be ommited or null.
                  exclusiveMinimum: 0
                part_tax_rate:
                  type: number
                  nullable: true
                  minimum: 0
                  description: Part tax rate. Can be applied only to repair order
                    with state 'estimate' and 'in_progress'.
                labor_tax_rate:
                  type: number
                  nullable: true
                  minimum: 0
                  description: Labor tax rate. Can be applied only to repair order
                    with state 'estimate' and 'in_progress'.
                sublet_tax_rate:
                  type: number
                  nullable: true
                  minimum: 0
                  description: Sublet tax rate. Can be applied only to repair order
                    with state 'estimate' and 'in_progress'.
                hazmat_tax_rate:
                  type: number
                  nullable: true
                  minimum: 0
                  description: Hazmat tax rate. Can be applied only to repair order
                    with state 'estimate' and 'in_progress'.
                customer_concern:
                  type: string
                  nullable: true
                  description: Represents the reason for Customer's Visit
                vehicle_use:
                  type: string
                  nullable: true
                  description: Represents the primary use of vehicle
              example:
                number: 1222
                odometer: 99999
                technician_id: 1
                advisor_id: 2
                detail: Key tag 85, customer waiting
                preferred_contact_type: phone
                taxable: false
                due_in_at: '2026-06-12T14:25:20Z'
                status_id: 1
                customer_source: Website
                part_discount_cents: 400
                labor_discount_percentage: 50
                label_id: 1
                part_tax_rate: 15
                labor_tax_rate: 25
                sublet_tax_rate: 35
                hazmat_tax_rate: 45
                customer_concern: example of reason for customers to visit
                vehicle_use: example of primary use of vehicle
