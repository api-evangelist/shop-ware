        example: '2022-10-12T12:30:00+00:00'
        schema:
          type: string
      - name: end_before
        in: query
        required: false
        format: date-time
        description: Filter to include records with clocked_out_at before specified
          date and time in ISO 8601 format
        example: '2022-10-14T12:30:00+00:00'
        schema:
          type: string
      - name: page
        in: query
        required: false
        example: '1'
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        example: '30'
        schema:
          type: integer
