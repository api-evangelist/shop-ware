  "/api/v1/tenants/{tenant_id}/repair_orders/{id}/share":
    parameters:
    - name: tenant_id
      in: path
      required: true
      example: '1'
      schema:
        type: integer
    - name: id
      in: path
      required: true
      example: '1'
      schema:
        type: integer
    post:
      summary: Share repair order via text
      tags:
      - Repair Orders
      parameters: []
      responses:
        '200':
          description: successful
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone_numbers:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: RO customer phone numbers to send text sms with RO
                    share link and message.
                text:
                  type: string
                  maxLength: 1480
                  description: Text which will be sent in sms along with RO share
                    link. If not present will be sent RO share link only.
              required:
              - phone_numbers
              example:
                phone_numbers:
                - "+14158900906"
                text: Test
  "/api/v2/tenants/{tenant_id}/repair_orders":
    parameters:
    - name: tenant_id
      in: path
      required: true
      example: '1'
      schema:
        type: integer
    get:
      summary: Get a list of all repair orders
      tags:
      - Repair Orders
      parameters:
      - name: cursor
        in: query
        required: false
        description: Encoded reference to the last record of the current page. It
          is empty for the first page.
        example: ''
        schema:
          type: string
      - name: per_page
        in: query
        required: false
        example: '1'
        schema:
          type: integer
      - name: shop_id
        in: query
        required: false
        description: Filter response to include only Repair Orders with this Shop
          ID.
        example:
        schema:
          type: integer
      - name: customer_id
        in: query
        required: false
        description: Filter response to include only Customer with this ID.
        example:
        schema:
          type: integer
      - name: vehicle_id
        in: query
        required: false
        description: Filter response to include only Vehicle with this ID.
        example:
        schema:
          type: integer
      - name: status
        in: query
        required: false
        description: 'Filter response to include only Repair Orders with the provided
          status: One of ''estimate'', ''in_progress'', or ''invoice''.'
        example: ''
        schema:
          type: string
      - name: number
        in: query
        required: false
        description: Filter response to include only Repair Orders with this RO number.
        example:
        schema:
          type: integer
      - name: closed_after
        in: query
        required: false
        format: date-time
        description: Filter response to include only Repair Orders having been closed
          (status = invoice) after the provided datetime.
        example:
        schema:
          type: string
      - name: technician_id
        in: query
        required: false
        description: Filter response to only include Repair Orders assigned to this
          Technican ID.
        example:
        schema:
          type: integer
      - name: associations[]
        in: query
        items:
          type: string
        required: false
        description: "\n    An optional list that controls what nested associations
          are included in the response.     Currently supported values are 'none',
          'payments', 'integrator_tags', 'label', 'financials',     'services', 'services.labors',
          'services.parts', 'services.hazmats', 'services.inspections', 'services.sublets'
          \    'customer', 'customer.phones', 'customer.integrator_tags'     'vehicle',
          'vehicle.integrator_tags.     Note that if you specify a deeply nested association
          e.g. 'services.hazmats', then 'services' is implied, so it's not necessary
          to provide 'services,services.hazmats'.     Example: /api/v1/tenants/<tenant
          id>/repair_orders?associations[]=customer&associations[]=services.inspections&associations[]=vehicle.integrator_tags\n
          \ "
        example:
        schema:
          type: array
      - name: updated_after
        in: query
        required: false
        format: date-time
        description: Filter response to only include records updated after a given
          time
        example: 2022-10-24T12%3A00%3A00%2B08%3A00
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              examples:
                successful:
                  value:
                    results:
