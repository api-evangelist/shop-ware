openapi: 3.0.1
info:
  title: API V1 API Partners GP Exceptions API
  version: v1
  contact:
    name: API Support
    email: support@shop-ware.com
security:
- api_partner_id: []
  api_secret: []
tags:
- name: GP Exceptions
paths:
  /api/v1/tenants/{tenant_id}/gp_exceptions:
    parameters:
    - name: tenant_id
      in: path
      required: true
      example: '1'
      schema:
        type: integer
    get:
      summary: Get a list of all gp exceptions
      tags:
      - GP Exceptions
      parameters:
      - name: page
        in: query
        required: false
        example: '1'
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        example: '30'
        schema:
          type: integer
      - name: updated_after
        in: query
        required: false
        format: date-time
        description: Filter response to only include records updated after a given time
        example: 2022-10-24T12%3A00%3A00%2B08%3A00
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              examples:
                successful:
                  value:
                    results:
                    - id: 1
                      created_at: '2026-06-09T14:22:49Z'
                      updated_at: '2026-06-09T14:22:49Z'
                      name: Fake Gp Exception Name
                      shop_id: 1
                      percent: 12.3
                      integrator_tags:
                      - id: 1
                        created_at: '2026-06-09T14:22:49Z'
                        updated_at: '2026-06-09T14:22:49Z'
                        taggable_type: GpException
                        taggable_id: 1
                        name: tag_name
                        value: tag_value
                    limit: 1
                    limited: false
                    total_count: 1
                    current_page: 1
                    total_pages: 1
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of this record.
                        name:
                          type: string
                          description: The GP exception name.
                        shop_id:
                          type: integer
                          description: A foreign key that points to the Shop this GP Exception belongs to.
                        percent:
                          type: number
                          description: 'The percent markup. Example: 24.5 would be 24.5%.'
                        integrator_tags:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: The tag primary key.
                              taggable_id:
                                type: integer
                                description: Entity identifier the tag attached to.
                              taggable_type:
                                type: string
                                description: Entity type the tag attached to.
                              name:
                                type: string
                                description: Tag Name.
                              value:
                                type: string
                                description: Tag Value.
                              created_at:
                                type: string
                                format: date-time
                                description: The date and time when tag was created.
                              updated_at:
                                type: string
                                format: date-time
                                description: The date and time when tag was last updated.
                        created_at:
                          type: string
                          format: date-time
                          description: Date and time when record was created.
                        updated_at:
                          type: string
                          format: date-time
                          description: Date and time when record was last updated.
                  limit:
                    type: integer
                  limited:
                    type: boolean
                  total_count:
                    type: integer
                  current_page:
                    type: integer
                  total_pages:
                    type: integer
  /api/v1/tenants/{tenant_id}/gp_exceptions/{id}:
    parameters:
    - name: tenant_id
      in: path
      required: true
      example: '1'
      schema:
        type: string
    - name: id
      in: path
      required: true
      example: '1'
      schema:
        type: string
    get:
      summary: Get a specific gp exception by ID
      tags:
      - GP Exceptions
      responses:
        '200':
          description: successful
          content:
            application/json:
              examples:
                successful:
                  value:
                    id: 1
                    created_at: '2026-06-09T14:22:52Z'
                    updated_at: '2026-06-09T14:22:52Z'
                    name: Fake Gp Exception Name
                    shop_id: 1
                    percent: 12.3
                    integrator_tags:
                    - id: 1
                      created_at: '2026-06-09T14:22:52Z'
                      updated_at: '2026-06-09T14:22:52Z'
                      taggable_type: GpException
                      taggable_id: 1
                      name: tag_name
                      value: tag_value
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Unique identifier of this record.
                  name:
                    type: string
                    description: The GP exception name.
                  shop_id:
                    type: integer
                    description: A foreign key that points to the Shop this GP Exception belongs to.
                  percent:
                    type: number
                    description: 'The percent markup. Example: 24.5 would be 24.5%.'
                  integrator_tags:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: The tag primary key.
                        taggable_id:
                          type: integer
                          description: Entity identifier the tag attached to.
                        taggable_type:
                          type: string
                          description: Entity type the tag attached to.
                        name:
                          type: string
                          description: Tag Name.
                        value:
                          type: string
                          description: Tag Value.
                        created_at:
                          type: string
                          format: date-time
                          description: The date and time when tag was created.
                        updated_at:
                          type: string
                          format: date-time
                          description: The date and time when tag was last updated.
                  created_at:
                    type: string
                    format: date-time
                    description: Date and time when record was created.
                  updated_at:
                    type: string
                    format: date-time
                    description: Date and time when record was last updated.
components:
  securitySchemes:
    api_partner_id:
      type: apiKey
      name: X-Api-Partner-Id
      in: header
    api_secret:
      type: apiKey
      name: X-Api-Secret
      in: header
