                    description: A foreign key that points to the GP Exception that fixes the sell price markup of this Inventory resource, or null if none.
                  partstech_part_id:
                    type: string
                    description: An identifier assigned to this inventory by PartsTech.
                  quantity_on_hand:
                    type: number
                  quantity_in_progress:
                    type: number
                    description: The number of units of this inventory item allocated to in-progress work orders.
                  quantity_needed:
                    type: number
                    description: The number of units this inventory item needed for in-progress work orders.
                  quantity_ordered:
                    type: number
                    description: The number of units of this inventory item ordered for in-progress work orders.
                  quantity_ordered_for_stock:
                    type: number
                    description: The number of units of this inventory item ordered for stock.
                  quantity_returned:
                    type: number
                    description: The number of units of this inventory item currently on return orders.
                  created_at:
                    type: string
                    format: date-time
                    description: Date and time when record was created.
                  updated_at:
                    type: string
                    format: date-time
                    description: Date and time when record was last updated.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cost_cents:
                  type: integer
                  minimum: 0
                  description: Cost in cents.
                list_price_cents:
                  type: integer
                  minimum: 0
                  description: MSRP in cents.
                  deprecated: true
                msrp_cents:
                  type: integer
                  minimum: 0
                  description: MSRP in cents.
                location:
                  type: string
                  description: Location.
                min_stock:
                  type: number
                  nullable: true
                  minimum: 0
                  exclusiveMaximum: 1000000
                  description: Min stock.
                max_stock:
                  type: number
                  nullable: true
                  minimum: 0
                  exclusiveMaximum: 1000000
                  description: Max stock.
                part_terminology_id:
                  type: string
                  description: Part Terminology Code from AAIA Parts Classification Database. This value is populated from eComm parts orders.
                part_type_metadata:
                  type: object
                  description: Required when part_terminology_id maps to a tire part type.
                  properties:
                    manufacturer:
                      type: string
                    tire_type:
                      type: string
                    tire_width:
                      type: number
                    tire_aspect:
                      type: number
                    construction_type:
                      type: string
                    rim_size:
                      type: number
                    load_range:
                      type: string
                    load_index:
                      type: number
                    speed_rating:
                      type: string
                    vendor_tire_size:
                      type: string
                    diameter:
                      type: string
              example:
                cost_cents: 179
                list_price_cents: 439
                location: C4
                min_stock: 1.0
                max_stock: 2.0
