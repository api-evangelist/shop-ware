summary: >-
  Cross-cutting request/response conventions for the Shop-Ware Partner API,
  derived from the public V1 and V2 OpenAPI. Two live major versions are served
  side by side under URI-path prefixes on api.shop-ware.com. All business
  resources are scoped to a tenant (shop) via /tenants/{tenant_id}/. V1
  paginates with page/per_page offset paging; V2 moves to opaque-cursor paging.
authentication:
  style: apiKey
  schemes:
