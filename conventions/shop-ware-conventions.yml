  base: https://api.shop-ware.com
  note: V1 and V2 are served concurrently; V2 is the recommended version.
pagination:
  v1:
    style: offset
    params: [page, per_page]
    default_per_page: 30
  v2:
    style: cursor
    params: [cursor, per_page]
    response_field: cursor
    note: cursor is an opaque encoded reference to the last record of the current page; empty for the first page.
tenancy:
  model: multi-tenant
  scope_param: tenant_id
  path_prefix: /api/{version}/tenants/{tenant_id}/
  note: Nearly every resource is nested under a tenant (shop); partner authorizations enumerate accessible tenants.
