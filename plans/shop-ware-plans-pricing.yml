description: >-
  Shopware offers a free open-source Community Edition and three paid commercial
  tiers (Rise, Evolve, Beyond) available as SaaS or self-hosted. Pricing is
  per-month per shop and scales with features such as B2B components, advanced
  search, digital sales rooms, and multi-inventory. An optional Shopware
  Intelligence+ AI add-on is available for all tiers.
sources:
  - https://www.shopware.com/en/pricing/
plans:
  - id: shopware-community
    name: Community Edition
    type: free
    description: >-
      Open-source MIT-licensed core of Shopware 6. Free to use with no GMV
      cap for shops under €1M GMV; merchants over €1M GMV must upgrade to
      a paid plan. Includes core product management, sales channels, and
      access to the developer community.
    entries:
      - label: License
        name: license
        type: boolean
        metric: included
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0'
        userMultiplied: false
      - label: GMV Threshold for Free Use
        name: gmv_threshold
        type: quota
        metric: EUR_GMV
        limit: 1000000
        timeFrame: year
        geo: global
        unit: 1
        price: '0'
        userMultiplied: false
