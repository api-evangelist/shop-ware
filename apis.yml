aid: shop-ware
name: Shop-Ware
description: >-
  Shop-Ware is cloud-based auto repair shop management software for independent
  automotive repair shops, backed by Insight Partners. It runs the digital
  workflow of a shop: digital vehicle inspections, repair orders, estimates,
  canned jobs and services, parts inventory and purchasing, customer and
  vehicle records, staff time clocks and pay rates, and integrated payments.
  Shop-Ware exposes a multi-tenant Partner API (V1 and V2, OpenAPI 3.0.1) that
  lets integrators read and manage these resources per shop (tenant) using two
  partner header credentials, plus an HTTPS webhook surface delivering
  object_type.event_action events (created / updated / deleted, and
  customer.merged) for near-real-time synchronization.
