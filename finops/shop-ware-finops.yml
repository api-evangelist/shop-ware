description: >-
  FOCUS-aligned FinOps profile for Shopware commercial plans. Shopware is billed
  monthly per shop instance across three paid tiers (Rise, Evolve, Beyond) plus an
  optional AI add-on. Self-hosted Community Edition deployments incur no platform
  license fee but carry hosting and operational costs. Cost optimization centers
  on selecting the appropriate tier for required feature sets and managing the
  GMV threshold that triggers mandatory plan upgrades.
