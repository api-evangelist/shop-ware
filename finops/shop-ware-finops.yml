principles:
  - name: Visibility
    description: >-
      Track Shopware monthly platform license costs per shop instance, add-on
      subscriptions, and any third-party plugin costs separately to establish
      full visibility into total e-commerce platform spend.
  - name: Optimization
    description: >-
      Right-size tier selection based on actual feature usage; avoid paying for
      Evolve or Beyond features not in active use. Monitor GMV thresholds to
      plan tier upgrade timing and budget accordingly.
  - name: Accountability
    description: >-
      Map platform costs to business units or storefronts. For multi-shop
      deployments, allocate per-shop license fees to individual revenue-generating
      channels to enable accurate cost-per-storefront reporting.
